<style>
:root{--navy:#082f49;--blue:#0284c7;--sky:#e0f2fe;--bg:#f8fafc;--text:#172033;--muted:#64748b;--white:#fff;--line:#dbe3ea;--green:#16a34a}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}a{text-decoration:none;color:inherit}button{border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:white}.outline{background:white;border:1px solid var(--line);color:var(--navy)}.container{max-width:1180px;margin:auto;padding:0 22px}
header{background:white;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}.head{height:70px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.mark{width:42px;height:42px;border-radius:11px;background:var(--navy);color:white;display:grid;place-items:center;font-weight:900;font-size:18px}.brand b{font-size:20px}.brand small{display:block;color:var(--muted)}
.nav{display:flex;gap:20px;color:#475569;font-size:14px}.nav a:hover{color:var(--blue)}
.hero{background:linear-gradient(135deg,var(--navy),var(--blue));color:white;padding:72px 0}.hero-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center}.hero h1{font-size:48px;line-height:1.05;margin:0 0 18px}.hero p{font-size:19px;line-height:1.6;color:#e0f2fe}.hero-actions{display:flex;gap:12px;margin-top:24px}.hero .outline{background:transparent;color:white;border-color:#bae6fd}.mock{background:white;color:var(--text);border-radius:20px;padding:20px;box-shadow:0 20px 50px #0003}.mock-top{display:flex;justify-content:space-between}.mock-card{background:var(--bg);border-radius:12px;padding:14px;margin-top:12px}.bar{height:8px;background:#dbeafe;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
section{padding:58px 0}.section-title{text-align:center;margin-bottom:30px}.section-title h2{font-size:32px;margin:0 0 8px}.section-title p{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:23px}.icon{font-size:30px}.card h3{margin:10px 0 7px}.muted{color:var(--muted);line-height:1.5}
.featured{border:2px solid var(--blue)}.price{font-size:30px;font-weight:900;color:var(--navy)}ul{padding-left:20px;line-height:1.9}.badge{display:inline-block;background:var(--sky);color:var(--navy);padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}
.login-area{display:none;min-height:75vh;padding:60px 0}.login-box{max-width:430px;margin:auto;background:white;border:1px solid var(--line);border-radius:18px;padding:28px}.field{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #cbd5e1;border-radius:8px}.hidden{display:none!important}
.app{display:none;min-height:80vh}.app-grid{display:grid;grid-template-columns:230px 1fr;min-height:80vh}.side{background:var(--navy);color:white;padding:20px}.side button{width:100%;text-align:left;margin:4px 0;background:transparent;color:#cbd5e1}.side button.active,.side button:hover{background:#164e63;color:white}.dash{padding:30px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat{background:white;padding:18px;border:1px solid var(--line);border-radius:14px}.stat strong{font-size:28px;display:block;margin-top:5px}.module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.module{background:white;border:1px solid var(--line);border-radius:14px;padding:18px}.table{width:100%;border-collapse:collapse;background:white;border-radius:12px;overflow:hidden}.table th,.table td{padding:13px;text-align:left;border-bottom:1px solid var(--line)}footer{background:var(--navy);color:white;padding:35px 0}.footer-grid{display:flex;justify-content:space-between;gap:20px}.small{font-size:13px;color:#cbd5e1}
@media(max-width:800px){.nav{display:none}.hero-grid,.cards,.module-grid{grid-template-columns:1fr}.hero h1{font-size:38px}.stat-grid{grid-template-columns:1fr 1fr}.app-grid{grid-template-columns:65px 1fr}.side span{display:none}.side{padding:10px}.dash{padding:18px}}
@media(max-width:500px){.stat-grid{grid-template-columns:1fr}.hero{padding:48px 0}.hero-actions{flex-direction:column}.footer-grid{flex-direction:column}}

.logo-image{width:52px;height:52px;background:#000;overflow:hidden;padding:2px;border-radius:10px}
.logo-image img{width:100%;height:100%;object-fit:cover;display:block}
.footer-logo{width:190px;max-width:100%;height:auto;display:block;background:#000;border-radius:10px;padding:4px}
.small a{color:#bae6fd}

.social-logo{
  width:52px;
  height:52px;
  display:grid;
  place-items:center;
  border-radius:15px;
  overflow:hidden;
}
.social-logo.facebook{background:#1877F2;}
.social-logo.instagram{
  background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fdf497 5%,#fd5949 45%,#d6249f 60%,#285AEB 90%);
}
.social-logo svg{width:32px;height:32px;display:block;}
.social-logo.facebook svg{width:31px;height:31px;}
